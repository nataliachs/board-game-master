spring:
  application:
    name: board-game-master
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
boardgame:
  rules:
    chunk-size: ${RULE_CHUNK_SIZE:1200}
    chunk-overlap: ${RULE_CHUNK_OVERLAP:200}
    max-bytes: ${RULE_MAX_BYTES:1048576}
    max-chunks: ${RULE_MAX_CHUNKS:10000}

spring:
  application:
    name: board-game-master
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      tracking-modes: cookie
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    com.boardgamemaster.rag.quotediagnostics: ${ANSWER_QUOTE_DIAGNOSTICS_LEVEL:OFF}
    com.boardgamemaster.rag.querydiagnostics: ${RAG_QUERY_DIAGNOSTICS_LEVEL:OFF}
  structured:
    format:
      console: ecs
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
boardgame:
  stt:
    provider: ${STT_PROVIDER:disabled}
    model: ${STT_MODEL:whisper-1}
    api-key: ${STT_API_KEY:}
    timeout: ${STT_TIMEOUT:30s}
  tts:
    provider: ${TTS_PROVIDER:disabled}
    model: ${TTS_MODEL:tts-1}
    api-key: ${TTS_API_KEY:}
    timeout: ${TTS_TIMEOUT:30s}
    voice: ${TTS_VOICE:alloy}
  voice:
    max-audio-bytes: ${VOICE_MAX_AUDIO_BYTES:2097152}
  session:
    recent-message-limit: ${SESSION_RECENT_MESSAGE_LIMIT:8}
    context-characters: ${SESSION_CONTEXT_CHARACTERS:8000}
  llm:
    provider: ${LLM_PROVIDER:disabled}
    model: ${LLM_MODEL:gpt-4.1-mini}
    reasoning-effort: ${LLM_REASONING_EFFORT:none}
    api-key: ${LLM_API_KEY:}
    timeout: ${LLM_TIMEOUT:30s}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:800}
  game-draft:
    # Drafting a whole game from a rulebook PDF in /admin: uses the LLM provider, model and key above.
    max-output-tokens: ${GAME_DRAFT_MAX_OUTPUT_TOKENS:16000}
    timeout: ${GAME_DRAFT_TIMEOUT:180s}
  answer:
    minimum-evidence-similarity: ${ANSWER_MINIMUM_EVIDENCE_SIMILARITY:0.5}
    high-evidence-similarity: ${ANSWER_HIGH_EVIDENCE_SIMILARITY:0.8}
    max-context-characters: ${ANSWER_MAX_CONTEXT_CHARACTERS:24000}
    minimum-quote-characters: ${ANSWER_MINIMUM_QUOTE_CHARACTERS:12}
  embedding:
    provider: ${EMBEDDING_PROVIDER:disabled}
    model: ${EMBEDDING_MODEL:text-embedding-3-small}
    api-key: ${EMBEDDING_API_KEY:}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
    timeout: ${EMBEDDING_TIMEOUT:30s}
    max-input-characters: ${EMBEDDING_MAX_INPUT_CHARACTERS:4000}
    max-document-chunks: ${EMBEDDING_MAX_DOCUMENT_CHUNKS:1000}
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.5}
    candidate-limit: ${RAG_CANDIDATE_LIMIT:200}
    duplicate-overlap: ${RAG_DUPLICATE_OVERLAP:0.85}
  query-rewrite:
    enabled: ${RAG_QUERY_REWRITE_ENABLED:false}
  evidence-review:
    enabled: ${RAG_EVIDENCE_REVIEW_ENABLED:false}
    candidate-floor: ${RAG_EVIDENCE_REVIEW_CANDIDATE_FLOOR:0.35}
    candidate-count: ${RAG_EVIDENCE_REVIEW_CANDIDATE_COUNT:12}
  rules:
    chunk-size: ${RULE_CHUNK_SIZE:1200}
    chunk-overlap: ${RULE_CHUNK_OVERLAP:200}
    max-bytes: ${RULE_MAX_BYTES:1048576}
    max-chunks: ${RULE_MAX_CHUNKS:10000}

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="header" class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="5" fill="none" stroke="#f2b45a" stroke-width="2.5"/><circle cx="11" cy="11" r="2.4" fill="#f2b45a"/><circle cx="21" cy="21" r="2.4" fill="#f2b45a"/><circle cx="21" cy="11" r="2.4" fill="#e0486f"/><circle cx="11" cy="21" r="2.4" fill="#e0486f"/></svg>
      Board Game Master
    </a>
    <nav class="site-nav" aria-label="Main"><a href="/#shelf">The shelf</a><a href="/admin">Admin</a></nav>
  </div>
</header>

<div th:fragment="alerts" class="alerts" aria-live="polite"><p th:if="${error}" class="alert error" role="alert" th:text="${error}"></p><p th:if="${notice}" class="alert" th:text="${notice}"></p></div>

<section th:fragment="conversation" id="conversation" class="card conversation" aria-labelledby="conversation-title">
  <h2 id="conversation-title">Your conversation</h2>
  <p th:if="${#lists.isEmpty(page.history)}" class="muted">Questions and answers will appear here. Asking a question keeps your place.</p>
  <a th:if="${page.olderCursor != null}" class="older-link" th:href="@{/sessions/{id}(id=${page.lesson.session.id},beforeSequence=${page.olderCursor})}">Older messages</a>
  <div th:if="${!#lists.isEmpty(page.history)}" id="conversation-log" class="conversation-log" tabindex="0" role="log"
       aria-label="Questions and answers, newest at the bottom">
  <article th:each="message : ${page.history}" class="message" th:classappend="${message.role.name() == 'USER' ? 'user-message' : 'assistant-message'}">
    <p class="eyebrow" th:text="${message.role.name() == 'USER' ? 'You' : 'Game Master'}"></p><p class="preserve" th:text="${message.content}"></p>
    <div th:if="${message.answer != null}" class="answer-details">
      <p class="confidence" th:classappend="${'confidence-' + #strings.toLowerCase(message.answer.confidence.name())}"
         th:text="${message.answer.confidence.name() == 'HIGH' ? 'High evidence' : (message.answer.confidence.name() == 'MEDIUM' ? 'Medium evidence' : 'Not verified by the rules')}"></p>
      <details th:if="${!#lists.isEmpty(message.answer.sources)}"><summary>View sources</summary>
        <article th:each="source : ${message.answer.sources}" class="citation"><strong th:text="${source.document}"></strong>
          <p><span th:text="${source.section}"></span><span th:if="${source.page != null}" th:text="${' · Page ' + source.page}"></span></p>
          <blockquote th:text="${source.quote}"></blockquote><p class="muted small" th:text="${source.sourceReference}"></p>
        </article>
      </details><p th:if="${message.answer.confidence.name() == 'LOW'}" class="muted small">The available rules did not support a verified answer. Try a more specific question or check your printed rules.</p>
    </div>
  </article>
  </div>
  <a th:if="${param.beforeSequence != null}" th:href="@{/sessions/{id}(id=${page.lesson.session.id})}">Latest messages</a>
</section>
</body></html>

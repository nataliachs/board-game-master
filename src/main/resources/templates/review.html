<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#140d1c"><title>Review rules · Board Game Master</title><link rel="stylesheet" href="/css/demo.css"></head><body><header th:replace="~{fragments :: header}"></header>
<main class="review-layout">
  <p class="eyebrow" th:text="${page.game.name}"></p><h1>Take another look.</h1>
  <p class="lead">Reviewing keeps your current lesson, setup and game exactly where you left them.</p>
  <a class="button primary" th:href="@{/sessions/{id}(id=${page.lesson.session.id})}">Return to your session</a>
  <section class="card review-card"><h2>Lessons you've reached</h2><details th:each="lesson : ${page.lessons}" th:if="${page.lesson.session.completedSections.contains(lesson.key) || lesson.key == page.lesson.session.currentSectionKey}"><summary th:text="${lesson.title}"></summary><p class="preserve" th:text="${lesson.explanation}"></p><p th:each="example : ${lesson.examples}" th:text="${example}"></p><p class="tip" th:each="tip : ${lesson.tips}" th:text="${tip}"></p><p class="muted small" th:each="reference : ${lesson.references}" th:text="${reference}"></p></details></section>
  <section class="card review-card" th:if="${page.lesson.session.setup != null &amp;&amp; page.lesson.session.setup.currentStepKey != null}"><h2>Setup steps you've reached</h2><details th:each="step : ${page.setupSteps}" th:if="${page.lesson.session.setup.completedStepKeys.contains(step.key) || step.key == page.lesson.session.setup.currentStepKey}"><summary th:text="${step.title}"></summary><p th:text="${step.instruction}"></p><p th:each="note : ${step.notes}" th:text="${note}"></p><p class="warnings" th:each="warning : ${step.warnings}" th:text="${warning}"></p></details></section>
</main><footer>Authored lessons are reading guidance; verified answer citations come from indexed rule sources.</footer></body></html>

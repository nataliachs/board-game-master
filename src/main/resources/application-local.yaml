spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:board_game_master}}
    username: ${DB_USERNAME:${POSTGRES_USER:board_game_master}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:}}
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
